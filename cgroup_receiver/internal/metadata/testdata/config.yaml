default:
all_set:
  metrics:
    container.memory.events:
      enabled: true
    container.memory.file:
      enabled: true
    container.memory.file.mapped:
      enabled: true
    container.memory.kernel:
      enabled: true
    container.memory.limit:
      enabled: true
    container.memory.pressure.stall_time:
      enabled: true
    container.memory.reclaimed:
      enabled: true
    container.memory.rss:
      enabled: true
    container.memory.usage:
      enabled: true
    container.memory.working_set:
      enabled: true
    container.memory.workingset.refaults:
      enabled: true
    k8s.node.memory.limit:
      enabled: true
    k8s.node.memory.pressure.stall_time:
      enabled: true
    k8s.pod.memory.limit:
      enabled: true
    k8s.pod.memory.pressure.stall_time:
      enabled: true
  resource_attributes:
    cgroup.path:
      enabled: true
    container.id:
      enabled: true
    k8s.pod.uid:
      enabled: true
none_set:
  metrics:
    container.memory.events:
      enabled: false
    container.memory.file:
      enabled: false
    container.memory.file.mapped:
      enabled: false
    container.memory.kernel:
      enabled: false
    container.memory.limit:
      enabled: false
    container.memory.pressure.stall_time:
      enabled: false
    container.memory.reclaimed:
      enabled: false
    container.memory.rss:
      enabled: false
    container.memory.usage:
      enabled: false
    container.memory.working_set:
      enabled: false
    container.memory.workingset.refaults:
      enabled: false
    k8s.node.memory.limit:
      enabled: false
    k8s.node.memory.pressure.stall_time:
      enabled: false
    k8s.pod.memory.limit:
      enabled: false
    k8s.pod.memory.pressure.stall_time:
      enabled: false
  resource_attributes:
    cgroup.path:
      enabled: false
    container.id:
      enabled: false
    k8s.pod.uid:
      enabled: false
filter_set_include:
  resource_attributes:
    cgroup.path:
      enabled: true
      metrics_include:
        - regexp: ".*"
    container.id:
      enabled: true
      metrics_include:
        - regexp: ".*"
    k8s.pod.uid:
      enabled: true
      metrics_include:
        - regexp: ".*"
filter_set_exclude:
  resource_attributes:
    cgroup.path:
      enabled: true
      metrics_exclude:
        - strict: "cgroup.path-val"
    container.id:
      enabled: true
      metrics_exclude:
        - strict: "container.id-val"
    k8s.pod.uid:
      enabled: true
      metrics_exclude:
        - strict: "k8s.pod.uid-val"
